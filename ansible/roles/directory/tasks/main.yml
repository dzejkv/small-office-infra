# Make the directory match policy/people.yml exactly:
#   new people are created, group changes are applied, and anyone not in the
#   roster (or marked `status: left`) is deleted. Runs from the admin machine and
#   talks to lldap through `docker exec`.

- name: Work out who should have an account
  ansible.builtin.set_fact:
    active_people: "{{ roster.people | rejectattr('status', 'defined') | list + (roster.people | selectattr('status', 'defined') | rejectattr('status', 'equalto', 'left') | list) }}"
    leavers: "{{ roster.people | selectattr('status', 'defined') | selectattr('status', 'equalto', 'left') | map(attribute='uid') | list }}"
    bootstrap_dir: "{{ secrets_dir }}/bootstrap"

- name: Prepare a private staging folder
  ansible.builtin.file:
    path: "{{ bootstrap_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [user-configs, group-configs, passwords]

- name: Initial passwords (generated once per person, kept in .secrets/users/)
  ansible.builtin.copy:
    dest: "{{ bootstrap_dir }}/passwords/{{ item.uid }}"
    content: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/users/' ~ item.uid, length=20, chars=['ascii_letters', 'digits']) }}"
    mode: "0600"
  loop: "{{ active_people }}"
  loop_control: { label: "{{ item.uid }}" }
  no_log: true

- name: Service account passwords (generated by Terraform)
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/{{ item.uid }}"
    dest: "{{ bootstrap_dir }}/passwords/{{ item.uid }}"
    mode: "0600"
  loop: "{{ roster.service_accounts }}"
  loop_control: { label: "{{ item.uid }}" }

- name: Directory admin password for this run
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/lldap-admin"
    dest: "{{ bootstrap_dir }}/admin"
    mode: "0600"

- name: Groups
  ansible.builtin.copy:
    dest: "{{ bootstrap_dir }}/group-configs/groups.json"
    mode: "0600"
    content: |
      {% for name in roster.groups %}
      {{ {'name': name} | to_json }}
      {% endfor %}

- name: Users
  ansible.builtin.copy:
    dest: "{{ bootstrap_dir }}/user-configs/users.json"
    mode: "0600"
    content: |
      {% for p in active_people %}
      {{ {'id': p.uid, 'email': p.uid ~ '@' ~ roster.domain, 'displayName': p.first ~ ' ' ~ p.last,
          'firstName': p.first, 'lastName': p.last, 'groups': ['all-staff'] + p.groups,
          'password_file': '/bootstrap/passwords/' ~ p.uid} | to_json }}
      {% endfor %}
      {% for s in roster.service_accounts %}
      {{ {'id': s.uid, 'email': s.uid ~ '@' ~ roster.domain, 'displayName': s.name,
          'groups': s.groups, 'password_file': '/bootstrap/passwords/' ~ s.uid} | to_json }}
      {% endfor %}

- name: Wait for the directory to be ready
  ansible.builtin.command: docker exec {{ lldap_container }} curl -sf http://localhost:17170/health
  register: health
  until: health.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: Apply the roster
  block:
    - name: Copy the staging folder into the directory server
      ansible.builtin.shell: |
        docker exec {{ lldap_container }} rm -rf /bootstrap
        docker cp "{{ bootstrap_dir }}" {{ lldap_container }}:/bootstrap
      changed_when: false

    - name: Create, update and remove accounts (DO_CLEANUP removes anyone not in the roster)
      ansible.builtin.command: >-
        docker exec -e DO_CLEANUP=true {{ lldap_container }}
        sh -c 'LLDAP_ADMIN_PASSWORD="$(cat /bootstrap/admin)" exec /app/bootstrap.sh'
      register: bootstrap
      changed_when: >-
        'successfully created' in bootstrap.stdout or 'deleted' in bootstrap.stdout
        or 'added' in bootstrap.stdout or 'removed' in bootstrap.stdout

  always:
    - name: Remove passwords from the directory server and the staging folder
      ansible.builtin.shell: |
        docker exec {{ lldap_container }} rm -rf /bootstrap
        rm -rf "{{ bootstrap_dir }}"
      changed_when: false

- name: Report leavers whose accounts were removed
  ansible.builtin.debug:
    msg: "Offboarded (no account any more): {{ leavers | join(', ') if leavers else 'nobody' }}"
