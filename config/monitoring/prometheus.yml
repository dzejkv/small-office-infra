# Prometheus for Kestrel Studio. Runs on the `monitoring` host in the mgmt segment.
# Blackbox and Pushgateway share the same host, so they are on localhost.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Results pushed by the nightly backup jobs.
  - job_name: backup
    honor_labels: true
    static_configs:
      - targets: ["localhost:9091"]

  # "Is the service answering?" checks across segments, through the firewall.
  - job_name: service-checks
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["10.20.20.10:3890"]
        labels: { service: directory-ldap, zone: servers }
      - targets: ["10.20.20.10:17170"]
        labels: { service: directory-web, zone: servers }
      - targets: ["10.20.20.20:22"]
        labels: { service: files-ssh, zone: servers }
      - targets: ["10.20.30.10:8000"]
        labels: { service: backup-server, zone: backup }
      - targets: ["10.20.40.20:1514"]
        labels: { service: siem, zone: mgmt }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
