groups:
  - name: office-services
    rules:
      - alert: ServiceDown
        expr: probe_success{job="service-checks"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is not answering ({{ $labels.instance }})"
          runbook: docs/runbooks/service-down.md

  - name: office-backups
    rules:
      - alert: BackupFailed
        expr: office_backup_last_status == 0
        labels: { severity: critical }
        annotations:
          summary: "Last backup on {{ $labels.instance }} failed"
          runbook: docs/runbooks/restore.md

      - alert: BackupTooOld
        expr: time() - office_backup_last_success_timestamp_seconds > 26 * 3600
        labels: { severity: warning }
        annotations:
          summary: "No successful backup on {{ $labels.instance }} for over 26 hours"
          runbook: docs/runbooks/restore.md

      - alert: BackupNeverRan
        expr: absent(office_backup_last_success_timestamp_seconds{instance="files"}) or absent(office_backup_last_success_timestamp_seconds{instance="directory"})
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "A server has no successful backup recorded"
